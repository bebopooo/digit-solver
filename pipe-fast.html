<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>管道题极速版 · 手机</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f2f4f8; color:#1c2330;
  max-width:520px; margin:0 auto;
  padding:10px 10px calc(20px + env(safe-area-inset-bottom));
  -webkit-user-select:none; user-select:none;
}
h1 { font-size:18px; text-align:center; margin:2px 0 10px; }
h1 small { font-size:11px; color:#98a2b3; font-weight:400; }
.card { background:#fff; border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 4px rgba(20,40,80,.08); }
.lbl { font-size:12px; color:#7a8699; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
.lbl .tip { font-size:11px; color:#b6bfcc; }
/* 图形行 */
.shapes { display:flex; gap:8px; }
.slot {
  flex:1; aspect-ratio:1/1.06; border:2px solid #dfe5ee; border-radius:12px; background:#fafbfd;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  cursor:pointer; position:relative;
}
.slot.on { border-color:#3576f6; background:#eef4ff; }
.slot .shape { width:52%; height:52%; }
.slot .num { font-size:11px; color:#98a2b3; font-weight:700; }
.slot.on .num { color:#3576f6; }
.shape { display:inline-block; }
.sh-tri { background:#FFC531; clip-path:polygon(50% 4%, 98% 97%, 2% 97%); }
.sh-cir { background:#3FAE4A; border-radius:50%; }
.sh-sqr { background:#E8432E; border-radius:12%; }
.sh-plus { background:#3B7CF0;
  clip-path:polygon(36% 0, 64% 0, 64% 36%, 100% 36%, 100% 64%, 64% 64%, 64% 100%, 36% 100%, 36% 64%, 0 64%, 0 36%, 36% 36%); }
/* 管道层 */
.layer { margin-bottom:10px; }
.layer-head { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.layer-tag { font-size:11px; color:#fff; border-radius:6px; padding:2px 8px; }
.layer-tag.choice { background:#d97706; }
.layer-tag.fixed { background:#3576f6; }
.layer-tag.new { background:#94a3b8; }
.layer-tag.free { background:#7c3aed; }
.layer-del { margin-left:auto; font-size:12px; color:#ef4444; background:none; border:none; padding:2px 6px; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { display:flex; border:2px solid #dfe5ee; border-radius:10px; overflow:hidden; background:#fff; }
.chip.sel { border-color:#3576f6; box-shadow:0 0 0 2px #d6e4ff; }
.chip.done .cell { color:#12b76a; }
.cell {
  width:36px; height:44px; line-height:44px; text-align:center;
  font-size:21px; font-weight:700; color:#c3cad6;
  border-right:1px solid #eef1f6; background:#fff;
}
.cell:last-child { border-right:none; }
.cell.filled { color:#1c2330; }
.chip.done .cell.filled { color:#12b76a; }
/* 键盘 */
.pad { display:flex; gap:8px; margin-top:2px; }
.pad button {
  flex:1; height:52px; border:none; border-radius:12px;
  font-size:22px; font-weight:700; background:#3576f6; color:#fff;
}
.pad button:active { opacity:.8; }
.pad2 { display:flex; gap:8px; margin-top:8px; }
.pad2 button {
  flex:1; height:40px; border:none; border-radius:10px;
  font-size:14px; font-weight:600; background:#e8ecf3; color:#4a5568;
}
.pad2 button:active { opacity:.7; }
/* 答案 */
.answer { text-align:center; min-height:30px; }
.answer .none { color:#98a2b3; font-size:14px; padding:6px 0; }
.answer .bad { color:#ef4444; font-size:14px; padding:6px 0; }
.ans-code { font-size:38px; font-weight:800; letter-spacing:9px; color:#12b76a; text-indent:9px; margin:2px 0; }
.ans-sub { font-size:12px; color:#7a8699; margin-top:2px; }
.ans-more { font-size:12px; color:#d97706; margin-top:6px; }
.actions { display:flex; gap:8px; margin-top:4px; }
.actions button { flex:1; height:42px; border:none; border-radius:12px; font-size:15px; font-weight:600; background:#e8ecf3; color:#4a5568; }
details.help { font-size:12px; color:#7a8699; }
details.help summary { cursor:pointer; padding:4px 0; }
details.help li { margin:5px 0 5px 18px; }
details.help b { color:#4a5568; }
</style>
</head>
<body>
<h1>管道题极速版 <small>1三角 2圆 3方 4十字</small></h1>

<div class="card">
  <div class="lbl"><span>开始（最上排）</span><span class="tip">点一下换图形</span></div>
  <div class="shapes" id="startRow"></div>
</div>

<div class="card">
  <div class="lbl"><span>管道（从上到下）</span><span class="tip">直接按数字，自动跳下一层</span></div>
  <div id="layers"></div>
  <div class="pad">
    <button data-d="1">1</button><button data-d="2">2</button>
    <button data-d="3">3</button><button data-d="4">4</button>
    <button data-d="del" style="background:#e8ecf3;color:#4a5568">⌫</button>
  </div>
  <div class="pad2">
    <button id="btnSkip" style="background:#7c3aed;color:#fff">跳过此层(出答案)</button>
    <button id="btnClear">清空</button>
  </div>
</div>

<div class="card">
  <div class="lbl"><span>最后（最下排）</span></div>
  <div class="shapes" id="endRow"></div>
</div>

<div class="card">
  <div class="lbl"><span>答案</span><span class="tip" id="solveInfo"></span></div>
  <div class="answer" id="answer"><div class="none">填好上排、管道、下排自动出答案</div></div>
</div>

<div class="card">
<details class="help">
  <summary>📖 用法（20 秒看懂）</summary>
  <ul>
    <li>图形按<b>形状</b>填：1=黄三角 2=绿圆 3=红方块 4=蓝十字。</li>
    <li><b>选项行不用输</b>：只输固定层，到选项行的位置按 <b>跳过此层(出答案)</b>，答案自动反推。</li>
    <li>拿显示的绿色代码去题目选项里找一样的那个就行；两层都是选项就按两次跳过。</li>
    <li>无解 = 图形或固定层填错了，核对一遍。</li>
  </ul>
</details>
</div>

<script>
/*SOLVER-START*/
// ===== 求解器（与 A工具 语义一致：code 第 i 位表示新排第 i 位来自原排第 code[i] 位）=====
function pipeApplyCode(arr, code) {
  var out = new Array(4);
  for (var i = 0; i < 4; i++) {
    var j = code.charCodeAt(i) - 48 - 1;
    if (j < 0 || j > 3) return null;
    out[i] = arr[j];
  }
  return out;
}

var PIPE_ALL_CODES = (function () {
  var res = [], d = [1, 2, 3, 4];
  function permute(arr, cur) {
    if (!arr.length) { res.push(cur.join('')); return; }
    for (var i = 0; i < arr.length; i++) permute(arr.slice(0, i).concat(arr.slice(i + 1)), cur.concat([arr[i]]));
  }
  permute(d, []);
  return res;
})();

// layers: [ [code,...], ... ] 空数组 = 反推层；start/end 为长度 4 数组
// 返回 solutions: [[每层所选 code], ...]（全部解，最多返回 24 个）
function solvePipe(start, end, layers) {
  var free = layers.map(function (l) { return !l || l.length === 0; });
  var choices = layers.map(function (l, i) { return free[i] ? PIPE_ALL_CODES : l; });
  var total = choices.reduce(function (a, c) { return a * c.length; }, 1);
  var solutions = [];
  if (total > 200000) return { solutions: [], error: '组合过多' };
  var idx = layers.map(function () { return 0; });
  for (var combo = 0; combo < total && solutions.length < 24; combo++) {
    var rem = combo;
    for (var i = layers.length - 1; i >= 0; i--) { idx[i] = rem % choices[i].length; rem = (rem / choices[i].length) | 0; }
    var cur = start.slice(), ok = true;
    for (var i = 0; i < layers.length; i++) {
      var code = choices[i][idx[i]];
      if (!/^[1-4]{4}$/.test(code) ||
          code[0]===code[1]||code[0]===code[2]||code[0]===code[3]||
          code[1]===code[2]||code[1]===code[3]||code[2]===code[3]) { ok = false; break; }
      cur = pipeApplyCode(cur, code);
      if (!cur) { ok = false; break; }
    }
    if (ok && cur[0]===end[0] && cur[1]===end[1] && cur[2]===end[2] && cur[3]===end[3]) {
      solutions.push(choices.map(function (c, i2) { return c[idx[i2]]; }));
    }
  }
  return { solutions: solutions, free: free };
}
/*SOLVER-END*/

// ===== 状态 =====
var SHAPE_KEYS = ['sh-tri','sh-cir','sh-sqr','sh-plus']; // 1..4
var state = {
  start: [0,0,0,0],   // 0=空 1..4
  end:   [0,0,0,0],
  layers: [ { chips: [''] } ],   // 每层若干个 4 位码（''=未填）
  sel: { l: 0, c: 0 }            // 当前选中层 / 片
};

function $(id){ return document.getElementById(id); }

// ===== 图形行 =====
function renderShapes(rowId, arr) {
  var box = $(rowId);
  box.innerHTML = '';
  for (var i = 0; i < 4; i++) {
    (function (i) {
      var s = document.createElement('div');
      s.className = 'slot' + (arr[i] ? ' on' : '');
      var v = arr[i];
      s.innerHTML = v
        ? '<span class="shape ' + SHAPE_KEYS[v-1] + '"></span><span class="num">' + v + '</span>'
        : '<span class="num" style="font-size:16px">?</span>';
      s.addEventListener('click', function () {
        arr[i] = (arr[i] + 1) % 5;
        renderShapes(rowId, arr);
        renderAnswer();
      });
      box.appendChild(s);
    })(i);
  }
}

// ===== 管道层 =====
function layerType(l, li) {
  var has = l.chips.some(function (c) { return c.length > 0; });
  if (!has) {
    if (l.skipped) return 'free';
    // 只有当后面还有已填层时，空层才当作「反推」；尾部空层只是待输入的新层
    var laterFilled = false;
    for (var i = li + 1; i < state.layers.length; i++) {
      if (state.layers[i].chips.some(function (c) { return c.length > 0; })) { laterFilled = true; break; }
    }
    return laterFilled ? 'free' : 'new';
  }
  return l.chips.length > 1 ? 'choice' : 'fixed';
}
function renderLayers() {
  var box = $('layers');
  box.innerHTML = '';
  state.layers.forEach(function (l, li) {
    var div = document.createElement('div');
    div.className = 'layer';
    var t = layerType(l, li);
    var head = document.createElement('div');
    head.className = 'layer-head';
    head.innerHTML = '<span class="layer-tag ' + (t==='choice'?'choice':t==='free'?'free':t==='new'?'new':'fixed') + '">'
      + '第' + (li+1) + '层' + (t==='choice'?' · 选项':t==='free'?' · 反推':t==='new'?' · 待输入':'')
      + '</span>';
    if (state.layers.length > 1) {
      var del = document.createElement('button');
      del.className = 'layer-del'; del.textContent = '删除';
      del.addEventListener('click', function () {
        state.layers.splice(li, 1);
        fixSel();
        renderLayers(); renderAnswer();
      });
      head.appendChild(del);
    }
    div.appendChild(head);
    var chips = document.createElement('div');
    chips.className = 'chips';
    l.chips.forEach(function (code, ci) {
      var chip = document.createElement('div');
      var complete = code.length === 4;
      chip.className = 'chip' + (state.sel.l===li && state.sel.c===ci ? ' sel' : '') + (complete ? ' done' : '');
      for (var k = 0; k < 4; k++) {
        var cell = document.createElement('div');
        cell.className = 'cell' + (code[k] ? ' filled' : '');
        cell.textContent = code[k] || '·';
        chip.appendChild(cell);
      }
      chip.addEventListener('click', function () {
        state.sel = { l: li, c: ci };
        renderLayers();
      });
      chips.appendChild(chip);
    });
    div.appendChild(chips);
    box.appendChild(div);
  });
}
function fixSel() {
  if (!state.layers.length) state.layers.push({ chips: [''] });
  if (state.sel.l >= state.layers.length) state.sel.l = state.layers.length - 1;
  var l = state.layers[state.sel.l];
  if (state.sel.c >= l.chips.length) state.sel.c = l.chips.length - 1;
}
function curChip() {
  fixSel();
  return state.layers[state.sel.l].chips[state.sel.c];
}

// ===== 键盘输入 =====
function tapDigit(d) {
  var chip = curChip();
  if (chip.length >= 4) { advanceChip(); chip = curChip(); }
  if (chip.length < 4) {
    state.layers[state.sel.l].chips[state.sel.c] = chip + d;
    renderLayers();
    renderAnswer();
  }
}
function advanceChip() {
  var l = state.layers[state.sel.l];
  if (state.sel.c < l.chips.length - 1) { state.sel.c++; return; }
  // 本层最后一片：若是选项层（>=2 片），自动开新层；否则也开新层（连输体验）
  state.layers.push({ chips: [''] });
  state.sel = { l: state.layers.length - 1, c: 0 };
}
function tapDel() {
  var l = state.layers[state.sel.l];
  var chip = l.chips[state.sel.c];
  if (chip.length > 0) { l.chips[state.sel.c] = chip.slice(0, -1); }
  else if (l.chips.length > 1) { l.chips.splice(state.sel.c, 1); state.sel.c = Math.max(0, state.sel.c - 1); }
  else if (state.layers.length > 1) {
    state.layers.splice(state.sel.l, 1);
    state.sel.l = Math.max(0, state.sel.l - 1);
    var prev = state.layers[state.sel.l];
    state.sel.c = prev.chips.length - 1;
  }
  fixSel();
  renderLayers(); renderAnswer();
}

document.querySelectorAll('.pad button').forEach(function (b) {
  b.addEventListener('click', function () {
    var d = b.getAttribute('data-d');
    if (d === 'del') tapDel();
    else tapDigit(d);
  });
});
$('btnSkip').addEventListener('click', function () {
  // 选项行不用输：留一层空白，答案直接反推出这层该填的码
  fixSel();
  var l = state.layers[state.sel.l];
  var curEmpty = l.chips.length === 1 && l.chips[0] === '';
  if (curEmpty) {
    // 当前是刚自动生成的新层：就地作为反推层，再开一层继续输入
    l.skipped = true;
    state.layers.push({ chips: [''] });
    state.sel = { l: state.layers.length - 1, c: 0 };
  } else {
    // 当前层已输入：在后面插入反推层，选中位置不变（下个数字会自动开新层）
    state.layers.push({ chips: [''], skipped: true });
  }
  renderLayers();
  renderAnswer();
});
$('btnClear').addEventListener('click', function () {
  state.start = [0,0,0,0]; state.end = [0,0,0,0];
  state.layers = [{ chips: [''] }];
  state.sel = { l: 0, c: 0 };
  renderShapes('startRow', state.start);
  renderShapes('endRow', state.end);
  renderLayers(); renderAnswer();
});

// ===== 答案 =====
function renderAnswer() {
  var box = $('answer'), info = $('solveInfo');
  var sOK = state.start.every(function (v) { return v; });
  var eOK = state.end.every(function (v) { return v; });
  // 每层有效码 + 显示索引映射（尾部自动生成的空层裁掉，跳过的反推层保留）
  var eff = [], map = [];
  state.layers.forEach(function (l, li) {
    var codes = l.chips.filter(function (c) { return c.length === 4; });
    eff.push(codes); map.push(li);
  });
  while (eff.length && eff[eff.length - 1].length === 0 && !state.layers[map[eff.length - 1]].skipped) {
    eff.pop(); map.pop();
  }
  var hasFilled = eff.some(function (c) { return c.length > 0; });
  if (!sOK || !eOK || !hasFilled) {
    box.innerHTML = '<div class="none">填好上排、管道、下排自动出答案</div>';
    info.textContent = '';
    return;
  }
  var res = solvePipe(state.start, state.end, eff);
  if (res.error) { box.innerHTML = '<div class="bad">' + res.error + '</div>'; info.textContent = ''; return; }
  if (!res.solutions.length) {
    box.innerHTML = '<div class="bad">✗ 无解——多半有图形或代码填错，核对一遍</div>';
    info.textContent = '';
    return;
  }
  var sol = res.solutions[0];
  var pickDisp = -1, pickCode = '';
  var choiceDisp = -1;
  for (var i = 0; i < eff.length; i++) {
    if (res.free[i] && pickDisp < 0) pickDisp = i;
    if (eff[i].length > 1 && choiceDisp < 0) choiceDisp = i;
  }
  if (choiceDisp >= 0) pickDisp = choiceDisp;

  var ansHtml = '', optNote = '';
  if (choiceDisp >= 0) {
    var n = eff[choiceDisp].indexOf(sol[choiceDisp]) + 1;
    optNote = '第' + (map[choiceDisp]+1) + '层 ' + eff[choiceDisp].length + ' 选 ' + n;
    pickCode = sol[choiceDisp];
  } else if (pickDisp >= 0 && res.free[pickDisp]) {
    optNote = '第' + (map[pickDisp]+1) + '层该是这个 → 选项里挑一样的';
    pickCode = sol[pickDisp];
  } else {
    ansHtml = '<div class="ans-code" style="font-size:24px;letter-spacing:2px;text-indent:2px">✓ 管道成立</div>';
  }
  if (pickCode) ansHtml += '<div class="ans-code">' + pickCode + '</div>';
  if (optNote) ansHtml += '<div class="ans-sub">' + optNote + '</div>';
  if (res.solutions.length > 1) {
    ansHtml += '<div class="ans-more">另有 ' + (res.solutions.length - 1) + ' 组合同样成立：'
      + res.solutions.slice(1, 4).map(function (s2) { return s2.join('→'); }).join('；')
      + (res.solutions.length > 4 ? ' …' : '') + '</div>';
  }
  box.innerHTML = ansHtml;
  info.textContent = res.solutions.length + ' 解';
}

// ===== init =====
renderShapes('startRow', state.start);
renderShapes('endRow', state.end);
renderLayers();
renderAnswer();
</script>
</body>
</html>
